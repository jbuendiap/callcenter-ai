<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Concierge Virtual - Demo Hotel</title>
    <style>
        body{margin:0;background:#0f172a;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif}
        .container{text-align:center;background:rgba(255,255,255,0.03);padding:50px;border-radius:30px;border:1px solid rgba(255,255,255,0.1)}
        .v-btn{width:100px;height:100px;border-radius:50%;background:#10b981;border:none;cursor:pointer;transition:0.3s;box-shadow:0 0 15px rgba(16,185,129,0.4)}
        .v-btn.active{background:#f59e0b;box-shadow:0 0 20px rgba(245,158,11,0.6)}
    </style>
</head>
<body>
    <div class="container">
        <h1>Asistente de Recepción</h1>
        <p>Pulsa el botón para consultar sobre servicios y reservas.</p>
        <button id="hotel-btn" class="v-btn" onclick="startCall()">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="white"><path d="M6 6h12v12H6z"/></svg>
        </button>
    </div>

    <script src="https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/index.js"></script>
    <script>
        const _key = "2fce25fb-0207-4023-808f-2313fd2ad247";
        const _aid = "bfc9c5e7-d832-4929-9fc2-3855110ef9b9";
        
        let vapi = null;
        let active = false;

        function startCall() {
            if (!vapi) vapi = new Vapi(_key);
            if (!active) {
                vapi.start(_aid);
                document.getElementById('hotel-btn').classList.add('active');
                active = true;
            } else {
                vapi.stop();
                resetUI();
            }
            vapi.on('call-end', () => resetUI());
        }

        function resetUI() {
            document.getElementById('hotel-btn').classList.remove('active');
            active = false;
        }
    </script>
</body>
</html>
