<!DOCTYPE html>
<html lang="es">
<head>

  <title>Plataforma de Comunicación</title>

    body {

      justify-content: center;
      height: 100vh;
      font-family: sans-serif;
    }

      max-width: 350px;
      width: 90%;
    }
    .b {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7c4dff 0%, #4411db 100%);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      transition: 0.3s;
    }
    .b.active {
      background: #ef4444;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
    }
    #s {
      margin-top: 20px;
      font-size: 12px;
      letter-spacing: 1px;
      color: #818cf8;
    }
  </style>
</head>
